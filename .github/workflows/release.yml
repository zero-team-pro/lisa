name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.run_number }}

jobs:
  quality:
    name: Format and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Install bot dependencies
        working-directory: bot
        run: corepack yarn install --immutable

      - name: Check formatting
        working-directory: bot
        run: corepack yarn prettier --plugin ./node_modules/prettier-plugin-sql/lib/index.js --check .. --ignore-path ../.prettierignore

      - name: Typecheck bot
        working-directory: bot
        run: corepack yarn typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Install bot dependencies
        working-directory: bot
        run: corepack yarn install --immutable

      - name: Run unit tests
        working-directory: bot
        run: corepack yarn test:unit

  build-images:
    name: Build, verify, and push images
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6

      - name: Prepare environment
        run: |
          cp .env.example .env
          install -d -m 777 bot/coverage

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build images with reusable cache
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: gateway,db,migrate,postgres-exporter,admin
          load: true
          pull: true
          set: |
            gateway.cache-from=type=gha,scope=lisa-gateway-linux-arm64
            gateway.cache-to=type=gha,scope=lisa-gateway-linux-arm64,mode=max,ignore-error=true
            db.cache-from=type=gha,scope=lisa-db-linux-arm64
            db.cache-to=type=gha,scope=lisa-db-linux-arm64,mode=max,ignore-error=true
            migrate.cache-from=type=gha,scope=lisa-migrate-linux-arm64
            migrate.cache-to=type=gha,scope=lisa-migrate-linux-arm64,mode=max,ignore-error=true
            postgres-exporter.cache-from=type=gha,scope=lisa-postgres-exporter-linux-arm64
            postgres-exporter.cache-to=type=gha,scope=lisa-postgres-exporter-linux-arm64,mode=max,ignore-error=true
            admin.cache-from=type=gha,scope=lisa-admin-linux-arm64
            admin.cache-to=type=gha,scope=lisa-admin-linux-arm64,mode=max,ignore-error=true

      - name: Prepare Docker network
        run: docker network create caddy || true

      - name: Verify gateway image
        run: docker compose run --rm --no-deps gateway yarn verify:ci

      - name: Push images
        run: |
          TAG="${TAG}" docker compose push \
            gateway \
            db \
            migrate \
            postgres-exporter \
            admin

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-coverage
          path: bot/coverage/lcov-report
          if-no-files-found: ignore
          retention-days: 1

      - name: Clean containers
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  deploy:
    name: Deploy selected revision
    needs:
      - quality
      - unit-tests
      - build-images
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/prod_deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST_PROD }}" >> ~/.ssh/known_hosts

      - name: Deploy selected image and revision
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/prod_deploy_key "${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }}" \
            "GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' TAG='${TAG}' DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd projects/lisa

          git fetch --all -p
          git checkout --detach "${DEPLOY_SHA}"

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

          echo "Revision: ${DEPLOY_SHA}"
          echo "Image tag: ${TAG}"
          docker compose pull
          docker compose up -d --no-build
          REMOTE

  cleanup-packages:
    name: Clean old GHCR versions
    needs: deploy
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - lisa-bot
          - lisa-db
          - lisa-db-migrate
          - lisa-postgres-exporter
          - lisa-admin

    steps:
      - name: Delete old package versions
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          gh api --paginate --slurp \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            --jq 'add | sort_by(.created_at) | reverse | .[10:] | .[].id' \
            | while read -r version_id; do
                gh api --method DELETE \
                  "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}"
              done
